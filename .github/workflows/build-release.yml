name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-2-0v:
    name: Build 2.0V Version (DLL OCR)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 2.0V/requirements.txt
          pip install pyinstaller

      - name: Verify DLL Files
        run: |
          if (-not (Test-Path "2.0V/dlls/oneocr.dll")) { Write-Error "oneocr.dll not found in dlls folder!"; exit 1 }
          if (-not (Test-Path "2.0V/dlls/oneocr.onemodel")) { Write-Error "oneocr.onemodel not found in dlls folder!"; exit 1 }
          if (-not (Test-Path "2.0V/dlls/onnxruntime.dll")) { Write-Error "onnxruntime.dll not found in dlls folder!"; exit 1 }
        shell: powershell

      - name: Build EXE
        run: |
          cd 2.0V
          pyinstaller build.spec

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkingSystem-2.0V
          path: 2.0V/dist/주차단속시스템.exe

  release:
    name: Create Release
    needs: [build-2-0v]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download 2.0V Artifact
        uses: actions/download-artifact@v4
        with:
          name: ParkingSystem-2.0V
          path: artifacts/2.0v

      - name: Rename Artifact
        run: |
          mv artifacts/2.0v/주차단속시스템.exe ParkingEnforcement-2.0V.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ParkingEnforcement-2.0V.exe
          generate_release_notes: true
          draft: false
          prerelease: false
