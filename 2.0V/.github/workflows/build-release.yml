name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      # DLL 자동 다운로드 (MORT 프로젝트에서 제공)
      - name: Download OCR DLLs
        run: |
          Write-Host "📦 OCR DLL 다운로드 중..."
          New-Item -ItemType Directory -Force -Path "dlls"
          
          # MORT 프로젝트에서 DLL 다운로드
          $dllUrl = "https://github.com/killkimno/MORT_VERSION/releases/download/oneocr/oneocr.zip"
          $zipPath = "oneocr.zip"
          
          Write-Host "   다운로드 URL: $dllUrl"
          
          try {
              Invoke-WebRequest -Uri $dllUrl -OutFile $zipPath -TimeoutSec 120
          } catch {
              Write-Host "❌ DLL 다운로드 실패: $_"
              throw "Failed to download OCR DLLs"
          }
          
          Write-Host "   ZIP 파일 크기: $([math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB"
          
          Expand-Archive -Path $zipPath -DestinationPath "dlls" -Force
          Remove-Item $zipPath
          
          Write-Host "✅ DLL 다운로드 완료"
          Get-ChildItem "dlls" | ForEach-Object { Write-Host "   - $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
      
      - name: Verify required files
        run: |
          $errors = @()
          
          if (!(Test-Path "dlls/oneocr.dll")) { $errors += "oneocr.dll not found" }
          if (!(Test-Path "dlls/oneocr.onemodel")) { $errors += "oneocr.onemodel not found" }
          if (!(Test-Path "dlls/onnxruntime.dll")) { $errors += "onnxruntime.dll not found" }
          if (!(Test-Path "best.pt")) { $errors += "best.pt not found" }
          
          if ($errors.Count -gt 0) {
              Write-Host "❌ 필수 파일 누락:"
              $errors | ForEach-Object { Write-Host "   - $_" }
              throw "Required files missing"
          }
          
          Write-Host "✅ 필수 파일 확인 완료:"
          Write-Host "   - oneocr.dll: $((Get-Item 'dlls/oneocr.dll').Length / 1MB) MB"
          Write-Host "   - oneocr.onemodel: $([math]::Round((Get-Item 'dlls/oneocr.onemodel').Length / 1MB, 2)) MB"
          Write-Host "   - onnxruntime.dll: $([math]::Round((Get-Item 'dlls/onnxruntime.dll').Length / 1MB, 2)) MB"
          Write-Host "   - best.pt: $([math]::Round((Get-Item 'best.pt').Length / 1MB, 2)) MB"
      
      - name: Build standalone EXE
        run: python -m PyInstaller build.spec --noconfirm
      
      - name: Verify build output
        run: |
          if (!(Test-Path "dist/주차단속시스템.exe")) { throw "Build failed - EXE not found" }
          $size = (Get-Item "dist/주차단속시스템.exe").Length / 1MB
          Write-Host "✅ Build successful! EXE size: $([math]::Round($size, 2)) MB"
      
      # 단일 EXE 파일로 업로드 (GitHub에서는 자동으로 zip 처리)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 주차단속시스템_EXE
          path: dist/주차단속시스템.exe
          retention-days: 30
          compression-level: 0  # exe 자체가 압축되어 있으므로 추가 압축 불필요
      
      # GitHub Release에 단일 EXE 업로드 (직접 다운로드 가능)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/주차단속시스템.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 📦 주차 단속 시스템 릴리즈
            
            ### 다운로드
            아래 `주차단속시스템.exe` 파일을 다운로드하여 실행하세요.
            
            ### 포함된 구성요소
            - OneOCR DLL (Windows Snipping Tool 기반 OCR)
            - YOLO 차량 번호판 인식 모델
            - 웹 기반 사용자 인터페이스
            
            ### 실행 방법
            1. `주차단속시스템.exe` 다운로드
            2. 더블클릭으로 실행
            3. 웹 브라우저에서 자동으로 열리는 주소로 접속
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
